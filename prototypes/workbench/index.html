function dossierHTML(r){
  const row=(label,color,icon,val)=>
    '<div class="drow"><span class="ibadge" style="'+color+'">'+svg(ICON[icon])+'</span>'+
    '<div style="min-width:0;flex:1"><div class="dl">'+label+'</div><div class="dv">'+val+'</div></div></div>';
  const v=r.verdict;
  const pill=r.status==='done'?'p-green':r.status==='pending'?'p-orange':r.status==='running'?'p-blue':'p-gray';
  const runTxt=typeof r.run==='string'?r.run:L(r.run);
  return '<div class="card"><h3>'+
      '<div class="dhead" style="flex:1"><span class="nm">'+t('pipe.dossier')+' · '+stageName(r.stage)+'</span></div>'+
      '<span class="pill '+pill+'">'+statusText(r.status)+'</span></h3><div class="bd">'+
    '<div style="font-size:11.5px;color:var(--label-3);margin-bottom:14px">'+
      '<span style="font-family:var(--mono)">'+L(r.skill)+'</span> · '+runTxt+
      (r.by?' · '+t('dossier.trigger',{who:L(r.by)}):'')+'</div>'+
    row(t('dossier.inputs'),tint('info'),'input',L(r.inputs))+
    row(t('dossier.actions'),tint('ok'),'action',L(r.actions))+
    row(t('dossier.artifacts'),tint('warn'),'artifact',L(r.artifacts))+
    row(t('dossier.gates'),tint('info'),'gate',L(r.gates))+
    row(t('dossier.verdict'),'background:var(--purple-t);color:var(--purple-d)','check',
      t('dossier.by')+' <b>'+roleName(v.by)+'</b> · '+t('dossier.method')+' <b>'+methodList(v.method,true)+'</b>'+
      ' · '+t('dossier.evidence')+' <b>'+(v.evidence?L(v.evidence):'—')+'</b>'+
      ' · '+t('dossier.at')+' <b>'+(v.at||'—')+'</b>'+
      ' · '+t('dossier.result')+' <b>'+statusText(v.result)+'</b>')+
    '</div></div>';

  return h+'</div></div>';
}

function viewReleases(p){
  const rows=a=>a.map(r=>'<div class="kv"><span class="sdot '+r[0]+'"></span><span class="k">'+r[1]+
    '</span><span class="v">'+L(r[2])+'</span></div>').join('');
  return '<div class="card"><h3>'+t('rel.pipeline')+'</h3><div class="bd">'+rows(p.ci.pipe)+'</div></div>'+
    '<div class="card"><h3>'+t('rel.servers')+'</h3><div class="bd">'+rows(p.ci.servers)+'</div></div>'+
    '<div class="card"><h3>'+t('rel.releases')+'</h3><div class="bd">'+rows(p.ci.releases)+'</div></div>'+
    '<div class="card"><h3>'+t('rel.events')+'</h3><div class="bd"><div class="log">'+
      p.ci.log.map(l=>'<div><b>'+l[0]+'</b>'+L(l[1])+'</div>').join('')+'</div></div></div>';
}

function viewRecords(p){
  const ks=Object.keys(p.records);
  if(!ks.length)return '<div class="card"><div class="empty">'+t('rec.empty')+'</div></div>';
  const rows=ks.map(i=>{const r=p.records[i];
    const st=r.status==='done'?'p-green':r.status==='running'?'p-blue':'p-orange';
    const runTxt=typeof r.run==='string'?r.run:L(r.run);
    return '<tr><td>'+i+' · '+stageName(r.stage)+'</td><td class="mono">'+L(r.skill)+'</td><td>'+runTxt+'</td>'+
      '<td>'+(r.by?L(r.by):'—')+'</td><td>'+roleName(r.verdict.by)+'</td><td>'+methodList(r.verdict.method,true)+'</td>'+
      '<td><span class="pill '+st+'">'+statusText(r.status)+'</span></td></tr>';}).join('');
  return '<div class="card"><h3>'+t('rec.title')+'</h3><div class="bd" style="padding:0">'+
    '<table class="audit"><thead><tr><th>'+t('st.phase')+'</th><th>skill</th><th>'+t('tbl.interval')+'</th>'+
    '<th>'+t('tbl.trigger')+'</th><th>'+t('tbl.owner')+'</th><th>'+t('tbl.method')+'</th>'+
    '<th>'+t('tbl.status')+'</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>'+
    '<div class="card"><h3>'+t('rec.auditTitle')+'</h3><div class="bd" style="font-size:12.5px;color:var(--label-2);line-height:1.75">'+
    t('rec.auditBody')+'</div></div>';
}

function renderInspector(){
  const el=document.getElementById('inspector');
  if(STATE.scope==='portfolio'){el.innerHTML=globalInspector();bindInspector();return;}
  const p=P();
  let g=null;
  if(STATE.gate){const s=STATE.gate.split('/');g=PROJECTS[s[0]].gates.find(x=>x.id===s[1]);}
  if(!g&&p.gates.length)g=p.gates[0];
  let h='<div class="ihead"><h2>'+t('ins.gate')+'</h2>'+
    '<button class="btn btn-p" onclick="openModal()">'+t('ins.insert')+'</button></div>';
  if(!g){el.innerHTML=h+'<div class="card"><div class="empty">'+t('ins.noGates')+'</div></div>';return;}
  h+='<div class="card"><h3><span class="gicon" style="'+tint(g.lv)+';width:22px;height:22px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center">'+
    svg(ICON[g.icon]||ICON.gate)+'</span>'+L(g.title)+'</h3><div class="bd">'+
    '<div style="font-size:11.5px;color:var(--label-3);line-height:1.85;margin-bottom:15px">'+
    t('ins.scopeLabel')+': '+L(g.scope)+'<br>'+t('ins.triggerLabel')+': '+gateTrigger(g)+'</div>'+
    '<div class="field"><label>'+t('ins.owner')+'</label><select>'+
      ROLE_KEYS.map(o=>'<option'+(o===g.owner?' selected':'')+'>'+t('role.'+o)+'</option>').join('')+'</select></div>'+
    '<div class="field"><label>'+t('ins.methods')+'</label><div class="checks">'+
      METHOD_KEYS.map(m=>'<label><input type="checkbox"'+(g.methods.indexOf(m)>=0?' checked':'')+'>'+
        t('m.'+m+'Short')+'</label>').join('')+
    '</div></div>'+
    '<div class="field"><label>'+t('ins.onFail')+'</label><select>'+
      FAIL_KEYS.map((o,i)=>'<option'+(i===0?' selected':'')+'>'+t('fail.'+o)+'</option>').join('')+'</select></div>'+
    '<div class="field"><label>'+t('ins.blockLabel')+'</label><label class="sw"><input type="checkbox"'+
      (g.block?' checked':'')+'><i></i><span style="font-size:12.5px">'+t('ins.blockThen')+'</span></label></div>'+
    '<div style="display:flex;gap:8px;margin-top:16px">'+
    '<button class="btn btn-p" style="flex:1" onclick="toast(\''+t('ins.save')+'\')">'+t('ins.save')+'</button>'+
    '<button class="btn" style="flex:1" onclick="toast(\''+t('toast.handled')+'\')">'+t('ins.rework')+'</button>'+
    '</div></div></div>';
  h+='<div class="card"><h3>'+t('ins.howRuns')+'</h3><div class="bd" style="font-size:12.5px;color:var(--label-2);line-height:1.75">'+
    t('ins.howRunsBody',{owner:'<b style="color:var(--label)">'+roleName(g.owner)+'</b>'})+'</div></div>';
  el.innerHTML=h;
}

  let h='<div class="ihead"><h2>'+t('ins.global')+'</h2>'+
    '<button class="btn btn-p" onclick="openModal()">'+t('ins.insert')+'</button></div>';

      '<span class="dot '+q.dot+'"></span><span class="k">'+q.name+'</span>'+
      '<span class="v">'+stageNo(q)+'/'+q.pipeline.length+(q.blk?' · '+q.blk:'')+'</span></div>';});

      METHOD_KEYS.map((m,i)=>'<label><input type="checkbox"'+(i<2||i===5?' checked':'')+'>'+
        t('m.'+m+'Short')+'</label>').join('')+
    '</div><div class="hint">'+t('modal.ownerHint')+'</div></div>'+
    '<div class="field"><label>'+t('ins.defaultFail')+'</label><select>'+
      FAIL_KEYS.map((o,i)=>'<option'+(i===0?' selected':'')+'>'+t('fail.'+o)+'</option>').join('')+'</select></div>'+
    '<div class="field"><label>'+t('ins.blockBehavior')+'</label><label class="sw"><input type="checkbox" checked><i></i>'+
    '<span style="font-size:12.5px">'+t('ins.blockThen')+'</span></label></div>'+
    '<div style="margin-top:14px"><button class="btn btn-p" style="width:100%" onclick="toast(\''+

      '<option>'+t('role.po')+'</option></select></div>';});
  h+='<div style="margin-top:14px"><button class="btn" style="width:100%" onclick="toast(\''+
    t('toast.roles')+'\')">'+t('ins.manage')+'</button></div>'+
  '</div></div>';

  h+='<div class="card"><h3>'+t('ins.notify')+'</h3><div class="bd">'+
    '<div class="field"><label>'+t('ins.when')+'</label><div class="checks">'+
      '<label><input type="checkbox" checked>'+t('ins.notifyBlocker',{n:blk||0})+'</label>'+
      '<label><input type="checkbox" checked>'+t('ins.notifyStage')+'</label>'+
      '<label><input type="checkbox">'+t('ins.notifyCi')+'</label>'+
      '<label><input type="checkbox">'+t('ins.notifyCrash')+'</label>'+
      '<label><input type="checkbox">'+t('ins.notifyRelease')+'</label>'+
    '</div></div>'+
    '<div class="field"><label>'+t('ins.channels')+'</label><div class="checks">'+
      '<label><input type="checkbox" checked>'+t('ins.chDesktop')+'</label>'+
      '<label><input type="checkbox" checked>'+t('ins.chEmail')+'</label>'+
      '<label><input type="checkbox">'+t('ins.chIm')+'</label>'+

  return h;

function bindInspector(){}
function renderAll(){
  document.documentElement.lang=I18N.meta().intl;
  renderMenubar();renderToolbar();renderSidebar();renderSeg();renderMain();renderInspector();renderStatusbar();
}

function bindMain(){
  document.querySelectorAll('.stage').forEach(s=>s.onclick=()=>{STATE.stage=+s.dataset.i;renderMain();});
  document.querySelectorAll('#main .gate[data-g]').forEach(g=>g.onclick=e=>{
    if(e.target.closest('.btn'))return;
    STATE.gate=g.dataset.g;renderMain();renderInspector();});
  document.querySelectorAll('#main .gate[data-s]').forEach(g=>g.onclick=e=>{
    if(e.target.closest('.btn'))return;
    const k=g.dataset.s;
    STATE.scope='project';STATE.project=k;STATE.view='inbox';STATE.gate=null;
    renderAll();toast(t('toast.enteredInbox',{project:PROJECTS[k].name}));});
  document.querySelectorAll('#main tr[data-s]').forEach(r=>r.onclick=()=>runAction('scope:'+r.dataset.s));
  document.querySelectorAll('#main .tlrow[data-s]').forEach(r=>r.onclick=()=>runAction('scope:'+r.dataset.s));
  document.querySelectorAll('#main .gate .gbtns .btn').forEach(b=>b.onclick=()=>{
    const card=b.closest('.gate');
    card.classList.add('done-gate');
    card.querySelectorAll('.btn').forEach(x=>x.disabled=true);
    if(card.dataset.g){
      const s=card.dataset.g.split('/');
      const q=PROJECTS[s[0]],gate=q.gates.find(x=>x.id===s[1]);
      if(gate&&gate.block)q.blk=Math.max(0,q.blk-1);
    }
    renderSidebar();renderSeg();renderStatusbar();
    toast(decodeURIComponent(b.dataset.msg));
  });
}

function localizeModal(){
  document.getElementById('modalTitle').textContent=t('modal.title');
  document.getElementById('mProjLabel').textContent=t('modal.project');
  document.getElementById('mScopeLabel').textContent=t('modal.where');
  document.getElementById('mNameLabel').textContent=t('modal.name');
  document.getElementById('mName').placeholder=t('modal.namePh');
  document.getElementById('mOwnerLabel').textContent=t('modal.owner');
  document.getElementById('mOwnerHint').textContent=t('modal.ownerHint');
  document.getElementById('mMethodsLabel').textContent=t('modal.methods');
  document.getElementById('mFailLabel').textContent=t('modal.onFail');
  document.getElementById('mBlockLabel').textContent=t('modal.block');
  document.getElementById('mBlockText').textContent=t('modal.blockLabel');
  document.getElementById('mNoteLabel').textContent=t('modal.note');
  document.getElementById('mNote').placeholder=t('modal.notePh');
  document.getElementById('mCancel').textContent=t('modal.cancel');
  document.getElementById('mCreate').textContent=t('modal.create');
  document.getElementById('mOwner').innerHTML=ROLE_KEYS.map(k=>'<option value="'+k+'">'+t('role.'+k)+'</option>').join('');
  document.getElementById('mMethods').innerHTML=METHOD_KEYS.map((m,i)=>
    '<label><input type="checkbox" value="'+m+'"'+((i===0)||(i===2)?' checked':'')+'>'+t('m.'+m)+'</label>').join('');
  document.getElementById('mFail').innerHTML=FAIL_KEYS.map(k=>'<option value="'+k+'">'+t('fail.'+k)+'</option>').join('');
}

function openModal(){
  localizeModal();
  const portfolio=STATE.scope==='portfolio';
  const p=P();
  const pw=document.getElementById('mProjWrap'),pj=document.getElementById('mProj');
  pw.style.display=portfolio?'':'none';
  if(portfolio){
    pj.innerHTML=keys().map(k=>'<option value="'+k+'"'+(k===STATE.project?' selected':'')+'>'+
      PROJECTS[k].name+'</option>').join('');
  }
  document.getElementById('mScope').innerHTML=
    p.pipeline.map((s,i)=>'<option value="'+(i+1)+'">'+(i+1)+' · '+stageName(s.n)+'</option>').join('')+
    p.tickets.map(tk=>'<option value="'+tk.id+'">'+tk.id+' · '+L(tk.t)+'</option>').join('')+
    '<option value="spec.md">spec.md</option>';
  document.getElementById('overlay').classList.add('on');
}
function closeModal(){document.getElementById('overlay').classList.remove('on');}

function createGate(){
  const target=(STATE.scope==='portfolio')?document.getElementById('mProj').value:STATE.project;
  const p=PROJECTS[target];
  const name=document.getElementById('mName').value.trim()||t('modal.title');
  const rawScope=document.getElementById('mScope').value;
  const scopeLabel=/^\d+$/.test(rawScope)?stageName('s'+rawScope):rawScope;
  const owner=document.getElementById('mOwner').value;
  const fail=document.getElementById('mFail').value;
  const block=document.getElementById('mBlock').checked;
  const methods=[].slice.call(document.querySelectorAll('#mMethods input:checked')).map(i=>i.value);
  const note=document.getElementById('mNote').value.trim();
  const id='x'+Date.now();
  p.gates.unshift({id:id,lv:'warn',icon:'gate',
    title:name,
    scope:scopeLabel,
    triggerKey:'gate.insertedByModal',
    owner:owner,methods:methods.length?methods:['signoff'],block:block,
    body:(note||t('ins.noGates'))+' — '+t('fail.'+fail),
    btns:[
      {labelKey:'gate.pass',msgKey:'gate.passMsg'},
      {labelKey:'fail.'+fail,msgKey:'toast.handled'}
    ]});
  if(block)p.blk++;
  STATE.scope='project';STATE.project=target;
  STATE.gate=target+'/'+id;STATE.view='inbox';
  closeModal();
  document.getElementById('mName').value='';document.getElementById('mNote').value='';
  renderAll();
  toast(t('toast.gateCreated',{project:p.name,scope:scopeLabel,owner:roleName(owner)}));
}

document.getElementById('overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeModal();});
document.addEventListener('click',()=>{
  if(openIdx!==null)closeMenu();
  if(STATE.sw){STATE.sw=false;renderSwitcher();}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(SETSTATE.open){closeSettings();return;}
    if(WZSTATE.open){closeWizard();return;}
    if(openIdx!==null){closeMenu();return;}
    if(document.getElementById('overlay').classList.contains('on')){closeModal();return;}
    if(STATE.sw){STATE.sw=false;renderSwitcher();}
    return;
  }
  if(!(e.metaKey||e.ctrlKey))return;
  const map={'0':'pview:overview','6':'pview:timeline','7':'pview:activity',
    '1':'view:pipeline','2':'view:board','3':'view:inbox','4':'view:releases','5':'view:records',
    'g':'insertGate','n':'newProject',',':'settings'};
  const a=map[e.key];
  if(a){e.preventDefault();runAction(a);}
});
document.getElementById('sbToggle').onclick=()=>{
  document.getElementById('sidebar').classList.toggle('collapsed');renderStatusbar();};
document.getElementById('inspToggle').onclick=()=>{
  document.getElementById('inspector').classList.toggle('collapsed');};
setInterval(()=>{
  const el=document.getElementById('mbClock');
  if(!el)return;
  const d=new Date();
  const wd=new Intl.DateTimeFormat(I18N.meta().intl,{weekday:'short'}).format(d);
  const hm=(d.getHours()<10?'0':'')+d.getHours()+':'+(d.getMinutes()<10?'0':'')+d.getMinutes();
  el.textContent=wd+' '+hm;
},20000);

renderAll();
</script>
