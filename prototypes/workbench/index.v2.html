<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Governance Workbench</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.0.20/400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.0.20/500.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.0.20/600.css">
<style>
  *{box-sizing:border-box}
  :root{
    --accent:#0071e3; --accent-h:#0077ed; --accent-d:#0062cc;
    --label:#1d1d1f; --label-2:#6e6e73; --label-3:#86868b; --label-4:#aeaeb2;
    --sep:rgba(60,60,67,.16); --sep2:rgba(60,60,67,.09);
    --fill:rgba(120,120,128,.10); --fill2:rgba(120,120,128,.16);
    --chrome:#f6f6f8; --content:#ffffff;

    --blue:#007aff;   --blue-t:rgba(0,122,255,.11);    --blue-d:#0062cc;
    --green:#34c759;  --green-t:rgba(52,199,89,.14);   --green-d:#248a3d;
    --orange:#ff9500; --orange-t:rgba(255,149,0,.16);  --orange-d:#b25000;
    --red:#ff3b30;    --red-t:rgba(255,59,48,.12);     --red-d:#d70015;
    --purple:#af52de; --purple-t:rgba(175,82,222,.13); --purple-d:#8944ab;
    --teal:#30b0c7;   --teal-t:rgba(48,176,199,.15);   --teal-d:#0071a4;
    --gray:#8e8e93;   --gray-t:rgba(120,120,128,.12);  --gray-d:#636366;

    --sh1:0 .5px 1px rgba(0,0,0,.045), 0 1px 3px rgba(0,0,0,.04);
    --sh2:0 1px 2px rgba(0,0,0,.05), 0 8px 22px rgba(0,0,0,.06);
    --sh3:0 16px 48px rgba(0,0,0,.17), 0 3px 10px rgba(0,0,0,.08);

    --r1:6px; --r2:9px; --r3:12px; --r4:16px;
    --ease:cubic-bezier(.32,.72,0,1);
    --sans:-apple-system,BlinkMacSystemFont,'Inter','SF Pro Text','Segoe UI Variable Text','Segoe UI','PingFang SC','Microsoft YaHei UI',system-ui,sans-serif;
    --mono:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;
  }
  html,body{height:100%}
  body{
    margin:0;background:var(--content);color:var(--label);overflow:hidden;
    font:400 13px/1.6 var(--sans);
    -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
    text-rendering:optimizeLegibility;font-feature-settings:"cv11","ss01";
  }
  .app{height:100vh;display:flex;flex-direction:column;background:var(--content)}
  .shell{flex:1;display:flex;min-height:0}

  .menubar{flex:0 0 28px;display:flex;align-items:center;padding:0 8px;position:relative;z-index:40;
    background:rgba(246,246,248,.84);border-bottom:.5px solid var(--sep);user-select:none;
    backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%)}
  .mb-app{font-size:13px;font-weight:600;letter-spacing:-.012em;padding:0 12px 0 6px;color:var(--label)}
  .mtitle{font-size:13px;color:var(--label);padding:2px 10px;border-radius:5px;cursor:default;
    transition:background .12s var(--ease),color .12s var(--ease)}
  .mtitle:hover{background:rgba(0,0,0,.06)}
  .mtitle.open{background:var(--accent);color:#fff}
  .extras{margin-left:auto;display:flex;align-items:center;gap:15px;font-size:12px;
    color:var(--label-2);font-variant-numeric:tabular-nums}
  .extras .x{display:flex;align-items:center;gap:5px}
  .extras .x svg{width:12px;height:12px;flex:0 0 12px}

  .menu{position:absolute;top:26px;min-width:236px;padding:5px;display:none;z-index:41;
    background:rgba(255,255,255,.92);border:.5px solid rgba(0,0,0,.09);border-radius:8px;
    box-shadow:0 12px 36px rgba(0,0,0,.18),0 2px 6px rgba(0,0,0,.07);
    backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%)}
  .menu.on{display:block;animation:pop .14s var(--ease)}
  .mitem{display:flex;align-items:center;gap:8px;padding:4px 9px;border-radius:5px;font-size:13px;
    color:var(--label);white-space:nowrap;position:relative}
  .mitem:not(.dis):hover{background:var(--accent);color:#fff}
  .mitem.dis{color:var(--label-4)}
  .mitem .mc{width:13px;flex:0 0 13px;font-size:11.5px}
  .mitem .ml{flex:1;overflow:hidden;text-overflow:ellipsis}
  .mitem .mk{color:var(--label-3);font-size:12.5px;letter-spacing:.03em}
  .mitem .arw{color:var(--label-4);font-size:10px;margin-left:6px}
  .mitem:not(.dis):hover .mk,.mitem:not(.dis):hover .arw{color:rgba(255,255,255,.88)}
  .msep{height:.5px;background:var(--sep);margin:5px 9px}
  .mitem.has-sub>.menu{top:-5px;left:100%;margin-left:3px}
  .mitem.has-sub:not(.dis):hover>.menu{display:block}

  .toolbar{flex:0 0 52px;display:flex;align-items:center;gap:12px;padding:0 16px;
    background:var(--chrome);border-bottom:.5px solid var(--sep);user-select:none}
  .iconbtn{width:28px;height:28px;border:0;background:transparent;border-radius:var(--r1);
    color:var(--label-2);display:flex;align-items:center;justify-content:center;cursor:pointer;
    transition:background .16s var(--ease),color .16s var(--ease)}
  .iconbtn:hover{background:var(--fill);color:var(--label)}
  .iconbtn svg{width:17px;height:17px}
  .tb-title{display:flex;flex-direction:column;line-height:1.22;min-width:0}
  .tb-title .tt{font-size:13.5px;font-weight:600;letter-spacing:-.01em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tb-title .ts{font-size:11px;color:var(--label-3)}
  .sp{flex:1}
  .search{display:flex;align-items:center;gap:6px;height:28px;padding:0 10px;width:216px;
    background:var(--fill);border-radius:var(--r2);color:var(--label-3);font-size:12.5px;
    border:.5px solid transparent;transition:all .18s var(--ease)}
  .search:hover{background:var(--fill2)}
  .search svg{width:13px;height:13px;flex:0 0 13px}

  .main-col{flex:1;display:flex;flex-direction:column;min-width:0}
  .cols{flex:1;display:flex;min-height:0}

  .sidebar{flex:0 0 238px;background:var(--chrome);border-right:.5px solid var(--sep);
    display:flex;flex-direction:column;min-height:0;transition:margin-left .28s var(--ease)}
  .sidebar.collapsed{margin-left:-238px}
  .sb-scroll{flex:1;overflow-y:auto;padding:8px 10px 12px;min-height:0}
  .sec{font-size:11px;font-weight:600;color:var(--label-3);letter-spacing:.01em;
    padding:12px 8px 6px;user-select:none}
  .sec:first-child{padding-top:2px}
  .pitem{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:var(--r1);
    cursor:pointer;transition:background .14s var(--ease)}
  .pitem:hover{background:var(--fill)}
  .pitem.on{background:var(--fill2)}
  .dot{width:8px;height:8px;border-radius:50%;flex:0 0 8px}
  .dot.run{background:var(--blue)} .dot.blk{background:var(--red)}
  .dot.ok{background:var(--green)} .dot.idle{background:#c7c7cc}
  .pitem .nm{flex:1;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pitem.on .nm{font-weight:500}
  .cnt{font-size:10.5px;font-weight:600;color:var(--red-d);background:var(--red-t);
    border-radius:99px;padding:1px 6px;min-width:18px;text-align:center}
  .meta{padding:6px 8px;font-size:11.5px;color:var(--label-2);line-height:1.85}
  .meta .mono{font-family:var(--mono);font-size:11px;color:var(--label-2)}

  .content{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden;background:var(--content)}
  .chead{flex:0 0 auto;display:flex;align-items:center;gap:16px;padding:20px 24px 14px;
    border-bottom:.5px solid var(--sep2)}
  .chead h1{margin:0;font-size:21px;font-weight:600;letter-spacing:-.022em;flex:1;min-width:0;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .seg{display:flex;gap:2px;padding:2px;background:var(--fill);border-radius:10px;flex:0 0 auto}
  .segbtn{position:relative;border:0;background:transparent;font:inherit;font-size:12.5px;
    font-weight:500;color:var(--label-2);padding:5px 12px;border-radius:8px;cursor:pointer;
    transition:all .18s var(--ease);font-family:inherit}
  .segbtn:hover{color:var(--label)}
  .segbtn.on{background:#fff;color:var(--label);box-shadow:0 .5px 1px rgba(0,0,0,.06),0 2px 6px rgba(0,0,0,.07)}
  .segdot{position:absolute;top:4px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--red)}
  .cbody{flex:1;overflow-y:auto;padding:20px 24px 28px}

  .toolbar{position:relative}
  .crumbs{display:flex;align-items:center;gap:3px;min-width:0}
  .crumb-btn{display:flex;align-items:center;gap:7px;color:var(--label);font-size:13.5px;
    font-weight:600;letter-spacing:-.012em;padding:4px 9px;border-radius:7px;cursor:pointer;
    background:var(--fill);border:.5px solid transparent;
    transition:background .14s var(--ease),border-color .14s var(--ease)}
  .crumb-btn:hover{background:var(--fill2);border-color:var(--sep)}
  .crumb-btn svg{width:11px;height:11px;color:var(--label-3);flex:0 0 11px}
  .crumb-to{display:flex;align-items:center;gap:7px;color:var(--label-2);font-size:13.5px;
    padding:4px 9px;border-radius:7px;cursor:pointer;transition:background .14s var(--ease)}
  .crumb-to:hover{background:var(--fill);color:var(--label)}
  .crumb-sep{color:var(--label-4);font-size:12px;padding:0 1px}
  .crumb-last{display:flex;align-items:center;gap:7px;color:var(--label);font-size:13.5px;
    font-weight:600;letter-spacing:-.012em;padding:4px 9px;border-radius:7px;cursor:pointer;
    background:var(--fill);border:.5px solid transparent;max-width:280px;
    transition:background .14s var(--ease),border-color .14s var(--ease)}
  .crumb-last:hover{background:var(--fill2);border-color:var(--sep)}
  .crumb-last span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .crumb-sub{font-size:11.5px;color:var(--label-3);margin-left:6px;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}

  .projsw{position:absolute;top:46px;left:14px;min-width:302px;padding:5px;display:none;z-index:39;
    background:rgba(255,255,255,.94);border:.5px solid rgba(0,0,0,.09);border-radius:9px;
    box-shadow:0 14px 40px rgba(0,0,0,.18),0 2px 6px rgba(0,0,0,.07);
    backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%)}
  .projsw.on{display:block;animation:pop .15s var(--ease)}
  .switem{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:6px;font-size:13px}
  .switem:hover{background:var(--fill)}
  .switem.on{background:var(--blue-t)}
  .switem .sw-nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .switem .sw-mt{font-size:11px;color:var(--label-3);font-family:var(--mono)}
  .switem .chk{color:var(--accent);font-size:11px;width:12px;flex:0 0 12px}

  .tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
  .tile{background:#fff;border:.5px solid var(--sep);border-radius:var(--r3);padding:14px 16px;
    box-shadow:var(--sh1)}
  .tile .tl{font-size:11px;font-weight:600;color:var(--label-3);margin-bottom:7px;letter-spacing:.01em}
  .tile .tv{font-size:26px;font-weight:600;letter-spacing:-.032em;line-height:1.05;
    font-variant-numeric:tabular-nums}
  .tile .tu{font-size:13px;font-weight:500;color:var(--label-3);margin-left:3px}
  .tile .tn{font-size:11px;color:var(--label-3);margin-top:6px}

  .ptbl{width:100%;border-collapse:collapse;font-size:12.5px}
  .ptbl th{text-align:left;font-weight:600;color:var(--label-3);font-size:10.5px;letter-spacing:.02em;
    padding:9px 12px;border-bottom:.5px solid var(--sep);white-space:nowrap}
  .ptbl td{padding:13px 12px;border-bottom:.5px solid var(--sep2);vertical-align:middle}
  .ptbl tbody tr{cursor:pointer;transition:background .14s var(--ease)}
  .ptbl tbody tr:hover{background:rgba(120,120,128,.055)}
  .ptbl tbody tr:last-child td{border-bottom:0}
  .pnm{display:flex;align-items:center;gap:10px;min-width:0}
  .pnm .txt{min-width:0}
  .pnm .n1{font-size:13px;font-weight:500;letter-spacing:-.005em;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}
  .pnm .n2{font-size:10.5px;color:var(--label-3);font-family:var(--mono);white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}
  .mini{display:flex;gap:2px;width:132px}
  .mini i{height:6px;flex:1;border-radius:2px;background:rgba(120,120,128,.17)}
  .mini i.done{background:var(--green)}
  .mini i.active{background:var(--blue)}
  .mini i.blocked{background:var(--red)}
  .tnum{font-variant-numeric:tabular-nums;color:var(--label-2)}
  .nowrap{white-space:nowrap}

  .tl{overflow-x:auto;margin:0 -4px;padding:0 4px}
  .tl-inner{min-width:640px}
  .tlhead,.tlrow{display:grid;grid-template-columns:184px minmax(0,1fr);align-items:center;gap:14px}
  .tlhead{padding-bottom:8px}
  .tlhead .hcell{font-size:10.5px;font-weight:600;color:var(--label-4);text-align:center;
    letter-spacing:.02em}
  .tlrow{padding:9px 0;border-top:.5px solid var(--sep2);cursor:pointer;
    transition:background .14s var(--ease)}
  .tlrow:hover{background:rgba(120,120,128,.045)}
  .tlname{display:flex;align-items:center;gap:8px;min-width:0;font-size:12.5px;font-weight:500}
  .tlname span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tltrack{display:grid;grid-template-columns:repeat(9,1fr);gap:2px}
  .tltrack i{height:22px;border-radius:4px;background:rgba(120,120,128,.12);
    transition:transform .16s var(--ease)}
  .tlrow:hover .tltrack i{transform:scaleY(1.06)}
  .tltrack i.done{background:var(--green-t);border:.5px solid rgba(52,199,89,.5)}
  .tltrack i.active{background:var(--blue);box-shadow:0 1px 4px rgba(0,122,255,.36)}
  .tltrack i.blocked{background:var(--red-t);border:.5px solid rgba(255,59,48,.5)}
  .tllegend{display:flex;gap:15px;font-size:11.5px;color:var(--label-2);margin-top:16px;flex-wrap:wrap}
  .tllegend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px}

  .feed{display:flex;flex-direction:column}
  .frow{display:flex;gap:13px;padding:11px 0;border-bottom:.5px solid var(--sep2);align-items:flex-start}
  .frow:last-child{border-bottom:0}
  .ftime{font-family:var(--mono);font-size:11px;color:var(--label-3);flex:0 0 40px;padding-top:2px;
    font-variant-numeric:tabular-nums}
  .fdot{width:7px;height:7px;border-radius:50%;flex:0 0 7px;margin-top:7px}
  .fbody{flex:1;min-width:0;font-size:12.5px;color:var(--label-2);line-height:1.55}
  .fbody b{color:var(--label);font-weight:500}
  .fproj{font-size:10.5px;color:var(--label-3);font-family:var(--mono);margin-top:3px}

  .card{background:#fff;border:.5px solid var(--sep);border-radius:var(--r3);box-shadow:var(--sh1);
    margin-bottom:16px;overflow:hidden}
  .card>h3{margin:0;padding:13px 16px;font-size:13px;font-weight:600;letter-spacing:-.005em;
    display:flex;align-items:center;gap:9px;border-bottom:.5px solid var(--sep2)}
  .card>.bd{padding:16px}

  .pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:500;
    border-radius:var(--r1);padding:2px 7px;white-space:nowrap}
  .p-blue{background:var(--blue-t);color:var(--blue-d)}
  .p-green{background:var(--green-t);color:var(--green-d)}
  .p-orange{background:var(--orange-t);color:var(--orange-d)}
  .p-red{background:var(--red-t);color:var(--red-d)}
  .p-purple{background:var(--purple-t);color:var(--purple-d)}
  .p-teal{background:var(--teal-t);color:var(--teal-d)}
  .p-gray{background:var(--gray-t);color:var(--gray-d)}

  .btn{font:inherit;font-size:12.5px;font-weight:500;border-radius:var(--r2);padding:5px 13px;
    cursor:pointer;border:.5px solid rgba(0,0,0,.11);background:#fff;color:var(--label);
    box-shadow:0 .5px 1px rgba(0,0,0,.04);font-family:inherit;
    transition:background .14s var(--ease),transform .12s var(--ease),border-color .14s var(--ease)}
  .btn:hover{background:#fafafa}
  .btn:active{transform:scale(.975)}
  .btn:disabled{opacity:.42;cursor:default;transform:none}
  .btn-p{background:var(--accent);border-color:transparent;color:#fff;
    box-shadow:0 1px 3px rgba(0,113,227,.32)}
  .btn-p:hover{background:var(--accent-h)}
  .btn-t{border-color:transparent;background:transparent;box-shadow:none;color:var(--accent);
    padding:5px 9px}
  .btn-t:hover{background:var(--blue-t)}

  .split{display:grid;grid-template-columns:242px minmax(0,1fr);gap:16px;align-items:start}
  .rail{display:flex;flex-direction:column;gap:1px}
  .stage{display:flex;gap:10px;padding:7px 9px;border-radius:var(--r2);cursor:pointer;
    transition:background .14s var(--ease)}
  .stage:hover{background:var(--fill)}
  .stage.on{background:var(--fill2)}
  .idx{width:20px;height:20px;flex:0 0 20px;border-radius:50%;font-size:10.5px;font-weight:600;
    display:flex;align-items:center;justify-content:center;background:var(--fill2);color:var(--label-2)}
  .stage.done .idx{background:var(--green-t);color:var(--green-d)}
  .stage.active .idx{background:var(--accent);color:#fff}
  .stage.blocked .idx{background:var(--red-t);color:var(--red-d)}
  .stage .nm{font-size:12.5px;font-weight:500;line-height:1.34;letter-spacing:-.005em}
  .stage .sk{font-size:11px;color:var(--label-3);line-height:1.45;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:158px}
  .stage.pending .nm{color:var(--label-3);font-weight:400}
  .gf{color:var(--orange);margin-left:3px;font-size:10px}

  .drow{display:flex;gap:12px;align-items:flex-start;padding:13px 0;border-bottom:.5px solid var(--sep2)}
  .drow:first-child{padding-top:2px}
  .drow:last-child{border-bottom:0;padding-bottom:2px}
  .ibadge{width:26px;height:26px;flex:0 0 26px;border-radius:8px;display:flex;align-items:center;
    justify-content:center}
  .ibadge svg{width:15px;height:15px}
  .dl{font-size:11px;font-weight:600;color:var(--label-3);margin-bottom:3px;letter-spacing:.01em}
  .dv{font-size:12.5px;color:var(--label-2);line-height:1.6}
  .dv b{color:var(--label);font-weight:600}
  .dv .mono{font-family:var(--mono);font-size:11.5px}

  .dhead{display:flex;align-items:center;gap:10px;margin-bottom:2px}
  .dhead .nm{font-size:14px;font-weight:600;letter-spacing:-.012em}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--label-2);margin-bottom:16px}
  .legend i{display:inline-block;width:8px;height:8px;border-radius:2.5px;margin-right:5px}

  .board{display:grid;grid-template-columns:repeat(5,minmax(164px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
  .col{display:flex;flex-direction:column;gap:10px;min-width:164px}
  .colhead{font-size:10.5px;font-weight:600;color:var(--label-4);padding-left:3px;letter-spacing:.02em}
  .tcard{background:#fff;border:.5px solid var(--sep);border-radius:var(--r3);padding:11px 12px;
    box-shadow:var(--sh1);transition:transform .18s var(--ease),box-shadow .18s var(--ease)}
  .tcard:hover{transform:translateY(-1px);box-shadow:var(--sh2)}
  .tcard.blocked{background:#fafafa;box-shadow:none}
  .tcard.blocked:hover{transform:none;box-shadow:none}
  .th{display:flex;align-items:center;gap:6px;margin-bottom:6px}
  .tid{font-family:var(--mono);font-size:10.5px;font-weight:600;color:var(--label-3)}
  .th .pill{margin-left:auto}
  .ttl{font-size:12.5px;font-weight:500;line-height:1.44;margin-bottom:9px;letter-spacing:-.005em}
  .tcard.blocked .ttl{color:var(--label-2);font-weight:400}
  .segs{display:flex;gap:3px;margin-bottom:8px}
  .segs i{height:4px;flex:1;border-radius:2px;background:rgba(120,120,128,.16)}
  .tcard.done .segs i{background:var(--green)}
  .tcard.prog .segs i.on{background:var(--blue)}
  .tcard.ready .segs i.on{background:var(--orange)}

const TINT={warn:['--orange-t','--orange-d'],crit:['--red-t','--red-d'],ok:['--green-t','--green-d'],info:['--blue-t','--blue-d']};

function P(){return PROJECTS[STATE.project];}
function tint(k){const c=TINT[k]||TINT.info;return 'background:var('+c[0]+');color:var('+c[1]+')';}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');
  clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),2500);}

let openIdx=null;
function isChecked(k){
  if(['overview','timeline','activity'].indexOf(k)>=0)return STATE.scope==='portfolio'&&STATE.pview===k;
  if(['pipeline','board','inbox','releases','records'].indexOf(k)>=0)
    return STATE.scope==='project'&&STATE.view===k;
  if(k==='sidebar')return !document.getElementById('sidebar').classList.contains('collapsed');
  if(k==='inspector')return !document.getElementById('inspector').classList.contains('collapsed');
  if(k==='afk')return !!STATE.afk;
  return false;
}
function buildMenu(items){
  return items.map(it=>{
    if(it==='-')return '<div class="msep"></div>';
    if(it.sub)return '<div class="mitem has-sub"><span class="mc"></span><span class="ml">'+it.l+
      '</span><span class="arw">▶</span><div class="menu">'+buildMenu(it.sub)+'</div></div>';
    return '<div class="mitem'+(it.dis?' dis':'')+'"'+(it.a&&!it.dis?' data-a="'+it.a+'"':'')+'>'+
      '<span class="mc">'+(it.c&&isChecked(it.c)?'✓':'')+'</span><span class="ml">'+it.l+'</span>'+
      (it.k?'<span class="mk">'+it.k+'</span>':'')+'</div>';
  }).join('');
}
function openMenuAt(i){
  const el=document.getElementById('menubar');
  el.querySelectorAll('.menu').forEach(m=>m.remove());
  const titles=el.querySelectorAll('.mtitle');
  titles.forEach((t,k)=>t.classList.toggle('open',k===i));
  openIdx=i;
  if(i===null)return;
  const box=document.createElement('div');
  box.className='menu on';
  box.style.left=titles[i].offsetLeft+'px';
  let items=MENUS[i].items.map(it=>{
    if(it==='-'||it.sub)return it;
    if(it.proj&&STATE.scope==='portfolio')return Object.assign({},it,{dis:true});
    return it;
  });
  if(MENUS[i].t==='文件'){
    const sub=[{l:'全部项目（总览）',a:'scope:portfolio'}];
    Object.keys(PROJECTS).forEach(k=>sub.push({l:PROJECTS[k].name+(PROJECTS[k].blk?'（'+PROJECTS[k].blk+' 个阻塞）':''),a:'scope:'+k}));
    items=items.concat(['-',{l:'前往项目',sub:sub}]);
  }
  box.innerHTML=buildMenu(items);
  box.querySelectorAll('.mitem[data-a]').forEach(it=>{
    it.onclick=e=>{e.stopPropagation();const a=it.dataset.a;closeMenu();if(a)runAction(a);};
  });
  box.querySelectorAll('.mitem.has-sub').forEach(it=>it.onclick=e=>e.stopPropagation());
  el.appendChild(box);
}
function closeMenu(){openMenuAt(null);}
function runAction(a){
  if(a.indexOf('view:')===0){STATE.scope='project';STATE.view=a.slice(5);renderAll();return;}
  if(a.indexOf('pview:')===0){STATE.scope='portfolio';STATE.pview=a.slice(6);renderAll();return;}
  if(a.indexOf('scope:')===0){
    const s=a.slice(6);
    if(s==='portfolio')STATE.scope='portfolio';
    else{STATE.scope='project';STATE.project=s;}
    STATE.stage=1;STATE.gate=null;STATE.sw=false;
    renderAll();
    toast(s==='portfolio'?'已切换到全部项目总览':'已切换到 '+PROJECTS[s].name);
    return;
  }
  const p=P();
  switch(a){
    case 'toggleSidebar':document.getElementById('sidebar').classList.toggle('collapsed');break;
    case 'toggleInspector':document.getElementById('inspector').classList.toggle('collapsed');break;
    case 'toggleAfk':STATE.afk=!STATE.afk;renderAll();
      toast(STATE.afk?'AFK 模式已开启 — agent 跑到下一个阻塞点才叫你':'AFK 模式已关闭');
      return;
    case 'insertGate':openModal();return;
    case 'approveAll':{
      const n=p.gates.filter(g=>g.block).length;
      p.gates.forEach(g=>{g.block=false;});
      p.blk=0;renderAll();
      toast(n?'已通过「'+p.name+'」的 '+n+' 个阻塞门，agent 继续往下跑':'当前项目没有待处理的门');
      return;}
    case 'advance':toast('已推进到下一阶段（原型）');break;
    case 'rerun':toast('已重跑当前阶段');break;
    case 'pauseAll':toast('已暂停全部 agent');break;
    case 'rescan':toast('已重新扫描 .scratch/ 与 tracker，记录刷新');break;
    case 'copyDossier':toast('阶段档案已拷贝为 markdown');break;
    case 'exportAudit':toast('审计表已导出为 CSV');break;
    case 'newProject':toast('已打开新建项目向导');break;
    case 'openWs':toast('已打开工作区选择器');break;
    case 'importRepo':toast('已打开仓库导入');break;
    case 'settings':toast('已打开项目设置');break;
    case 'gateDefaults':toast('已打开门的默认配置');break;
    case 'assignRoles':toast('已打开角色分派');break;
    case 'helpFlow':toast('grill-with-docs → prototype/handoff → to-spec → to-tickets → implement(-spec) → code-review → retro');break;
    case 'helpSkills':toast('skill 参考：见 ~/.agents/skills/');break;
    case 'about':toast('Governance Workbench · 原型 v4');break;
    default:toast(a.indexOf('preset:')===0?'验收方法预设已切换':'（原型）'+a);
  }
}
function renderMenubar(){
  const el=document.getElementById('menubar');
  const d=new Date();
  const wd=['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];
  const hm=(d.getHours()<10?'0':'')+d.getHours()+':'+(d.getMinutes()<10?'0':'')+d.getMinutes();
  const blk=Object.values(PROJECTS).reduce((n,q)=>n+q.blk,0);
  const run=Object.values(PROJECTS).reduce((n,q)=>n+q.running,0);
  el.innerHTML='<span class="mb-app">Governance</span>'+
    MENUS.map((m,i)=>'<span class="mtitle" data-i="'+i+'">'+m.t+'</span>').join('')+
    '<span class="extras">'+
      '<span class="x">'+svg(ICON.bolt)+(run?run+' 个 agent':'无 agent')+'</span>'+
      '<span class="x">'+svg(ICON.check)+'CI 绿</span>'+
      '<span class="x">'+svg(ICON.gate)+blk+' 待处理</span>'+
      '<span class="x" id="mbClock">'+wd+' '+hm+'</span>'+
    '</span>';
  el.querySelectorAll('.mtitle').forEach(t=>{
    t.onclick=e=>{e.stopPropagation();openMenuAt(openIdx===+t.dataset.i?null:+t.dataset.i);};
    t.onmouseenter=()=>{if(openIdx!==null&&openIdx!==+t.dataset.i)openMenuAt(+t.dataset.i);};

  if(openIdx!==null)openMenuAt(openIdx);
}

function renderSeg(){
  const blk=Object.values(PROJECTS).reduce((n,q)=>n+q.blk,0);

function renderStatusbar(){

function renderMain(){
  const m=document.getElementById('main');
  if(STATE.scope==='portfolio'){
    m.innerHTML=STATE.pview==='overview'?pOverview()
      :STATE.pview==='timeline'?pTimeline():pActivity();
  }else{
    const p=P();
    m.innerHTML=STATE.view==='pipeline'?viewPipeline(p)
      :STATE.view==='board'?viewBoard(p)
      :STATE.view==='inbox'?viewInbox()
      :STATE.view==='releases'?viewReleases(p):viewRecords(p);

  bindMain();

function stageKeys(){return Object.keys(PROJECTS);}
function ciOf(q){const c=q.ci.pipe[0];return {lv:c[0],id:c[1].split(' · ')[0],res:c[2]};}
function tintDot(d){return d==='run'?'background:var(--blue)'
  :d==='blk'?'background:var(--red)':'background:var(--green)';}

function pOverview(){
  const keys=stageKeys(),ps=keys.map(k=>PROJECTS[k]);
  const blk=ps.reduce((n,q)=>n+q.blk,0);
  const run=ps.reduce((n,q)=>n+q.running,0);
  const ciBad=ps.filter(q=>ciOf(q).lv!=='ok').length;
  const done=ps.filter(q=>q.stageNo===q.stageTotal&&!q.blk).length;
  const stalled=ps.filter(q=>q.blk>0).length;
  const tile=(l,v,u,n)=>'<div class="tile"><div class="tl">'+l+'</div><div class="tv">'+v+
    (u?'<span class="tu">'+u+'</span>':'')+'</div>'+(n?'<div class="tn">'+n+'</div>':'')+'</div>';
  let h='<div class="tiles">'+
    tile('项目总数',keys.length,'个',done+' 个已跑完 · '+stalled+' 个有待处理阻塞')+
    tile('并行 agent',run,'个',run?'正在建造中':'当前无 agent 运行')+
    tile('待处理阻塞',blk,'个',blk?'需你介入才能继续':'所有项目均无阻塞')+
    tile('CI 健康',(keys.length-ciBad)+'/'+keys.length,'',ciBad?ciBad+' 个项目最新流水线失败':'全部流水线通过')+
  '</div>';

  h+='<div class="card"><h3>项目跟踪'+
    '<span style="margin-left:auto;font-size:11px;color:var(--label-3);font-weight:400">点击任一行进入该项目</span>'+
    '</h3><div class="bd" style="padding:0"><table class="ptbl"><thead><tr>'+
    '<th>项目</th><th>阶段推进</th><th>当前阶段</th><th>阻塞</th><th>Agent</th><th>CI</th><th>最近活动</th>'+
    '</tr></thead><tbody>';
  keys.forEach(k=>{const q=PROJECTS[k],ci=ciOf(q);
    h+='<tr data-s="'+k+'">'+
      '<td><div class="pnm"><span class="dot '+q.dot+'"></span><div class="txt">'+
        '<div class="n1">'+q.name+'</div><div class="n2">'+q.branch+'</div></div></div></td>'+
      '<td><div style="display:flex;align-items:center;gap:9px"><span class="mini">'+
        q.pipeline.map(s=>'<i class="'+s.s+'"></i>').join('')+'</span>'+
        '<span class="tnum">'+q.stageNo+'/'+q.stageTotal+'</span></div></td>'+
      '<td><span class="pill '+(q.dot==='blk'?'p-red':q.dot==='run'?'p-blue':'p-green')+'">'+
        q.stageName+'</span></td>'+
      '<td>'+(q.blk?'<span class="pill p-red">'+q.blk+' 个</span>':'<span class="tnum" style="color:var(--label-3)">—</span>')+'</td>'+
      '<td class="tnum">'+(q.running?q.running+' 个':'<span style="color:var(--label-3)">—</span>')+'</td>'+
      '<td><div style="display:flex;align-items:center;gap:7px"><span class="sdot '+ci.lv+'"></span>'+
        '<div><div class="tnum">'+ci.id+'</div>'+
        '<div style="font-size:10.5px;color:var(--label-3);white-space:nowrap">'+ci.res+'</div></div></div></td>'+
      '<td><div class="tnum">'+q.updated+'</div>'+
        '<div style="font-size:11px;color:var(--label-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:236px">'+
        q.note+'</div></td>'+
    '</tr>';});
  h+='</tbody></table></div></div>';

  h+='<div class="card"><h3>待处理阻塞'+
    (blk?'<span class="pill p-red" style="margin-left:9px">'+blk+'</span>':'')+
    '<span style="margin-left:auto;font-size:11px;color:var(--label-3);font-weight:400">全部项目聚合 · 含不阻塞项</span>'+
    '</h3><div class="bd">';
  let any=false;
  keys.forEach(k=>{const q=PROJECTS[k];
    q.gates.forEach(g=>{any=true;
      h+='<div class="gate'+(g.block?'':' done-gate')+'" style="cursor:pointer" data-s="'+k+'">'+
        '<div class="gh"><span class="gicon" style="'+tint(g.lv)+'">'+svg(ICON[g.icon]||ICON.gate)+'</span>'+
        '<span class="nm">'+g.title+'</span>'+
        '<span class="pill '+(g.block?'p-red':'p-gray')+'">'+(g.block?'阻塞':'不阻塞')+'</span></div>'+
        '<div class="gmeta"><span class="pill p-gray">'+q.name+'</span>'+
        '<span class="pill p-gray">'+g.scope+'</span>'+
        '<span class="pill p-blue">验收人：'+g.owner+'</span></div>'+

  if(!any)h+='<div class="empty">所有项目都没有待处理的阻塞点。可以放心离开。</div>';
  h+='</div></div>';
  return h;
}

function pActivity(){
  const rows=[];
  stageKeys().forEach(k=>{const q=PROJECTS[k];
    q.ci.log.forEach(l=>rows.push({t:l[0],proj:q.name,dot:q.dot,text:l[1]}));});
  rows.sort((a,b)=>a.t<b.t?1:a.t>b.t?-1:0);
  let h='<div class="card"><h3>跨项目动态'+
    '<span style="margin-left:auto;font-size:11px;color:var(--label-3);font-weight:400">按时间倒序 · 合并全部项目的运行日志</span>'+
    '</h3><div class="bd"><div class="feed">'+
    rows.map(r=>'<div class="frow"><span class="ftime">'+r.t+'</span>'+
      '<span class="fdot" style="'+tintDot(r.dot)+'"></span>'+
      '<div class="fbody">'+r.text+'<div class="fproj">'+r.proj+'</div></div></div>').join('')+
    '</div></div></div>';
  h+='<div class="card"><h3>按项目统计</h3><div class="bd"><table class="ptbl"><thead><tr>'+
    '<th>项目</th><th>阶段</th><th>已完成</th><th>阻塞</th><th>提交</th><th>最近更新</th>'+
    '</tr></thead><tbody>';
  stageKeys().forEach(k=>{const q=PROJECTS[k];
    const dn=q.pipeline.filter(s=>s.s==='done').length;
    h+='<tr data-s="'+k+'"><td><div class="pnm"><span class="dot '+q.dot+'"></span>'+
      '<div class="txt"><div class="n1">'+q.name+'</div></div></div></td>'+
      '<td class="tnum">'+q.stageNo+'/'+q.stageTotal+'</td>'+
      '<td class="tnum">'+dn+' 个阶段</td>'+
      '<td class="tnum">'+(q.blk||'—')+'</td>'+
      '<td class="tnum">'+(q.commits||'—')+'</td>'+

  return h;

function viewPipeline(p){
  const rail=p.pipeline.map((s,i)=>
    '<div class="stage '+s.s+(STATE.stage===i+1?' on':'')+'" data-i="'+(i+1)+'">'+
    '<span class="idx">'+(i+1)+'</span><div style="min-width:0"><div class="nm">'+s.n+
    (s.g?'<span class="gf">◆</span>':'')+'</div><div class="sk">'+s.sk+'</div></div></div>').join('');
  const r=p.records[STATE.stage];
  const dossier=r?dossierHTML(r):'<div class="card"><div class="empty">该阶段尚未执行，没有档案。<br>阶段开始后，输入、动作流、产物与验收结论会实时落进这里。</div></div>';
  return '<div class="split"><div class="card"><h3>流水线</h3><div class="bd rail">'+rail+'</div></div>'+
    '<div>'+dossier+'</div></div>';
}

function dossierHTML(r){
  const row=(label,color,icon,val)=>
    '<div class="drow"><span class="ibadge" style="'+color+'">'+svg(ICON[icon])+'</span>'+
    '<div style="min-width:0;flex:1"><div class="dl">'+label+'</div><div class="dv">'+val+'</div></div></div>';
  const v=r.verdict;
  const st=r.status==='已通过'?'p-green':r.status==='待批准'?'p-orange':r.status==='进行中'?'p-blue':'p-gray';
  return '<div class="card"><h3>'+
      '<div class="dhead" style="flex:1"><span class="nm">阶段档案 · '+r.title+'</span></div>'+
      '<span class="pill '+st+'">'+r.status+'</span></h3><div class="bd">'+
    '<div style="font-size:11.5px;color:var(--label-3);margin-bottom:14px">'+
      '<span class="mono" style="font-family:var(--mono)">'+r.skill+'</span> · run '+r.run+' · 触发：'+r.by+'</div>'+
    row('输入（指针）',tint('info'),'input',r.inputs.join(' · '))+
    row('动作流（append-only）',tint('ok'),'action',r.actions.join(' · '))+
    row('产物增量（指针 + 哈希）',tint('warn'),'artifact',r.artifacts.join(' · '))+
    row('门',tint('info'),'gate',r.gates.join(' · '))+
    row('验收结论','background:var(--purple-t);color:var(--purple-d)','check',
      '验收人 <b>'+v.by+'</b> · 方法 '+v.method+' · 依据 '+v.evidence+' · 时间 '+v.at+' · 结论 <b>'+v.result+'</b>')+
    '</div></div>';
}

function viewBoard(p){
  if(!p.tickets.length)return '<div class="card"><div class="empty">还没有切片。<br>跑完 /to-spec 与 /to-tickets，看板会自动出现。<br><br>记住：切片必须是垂直的 — 每片穿透数据库、服务、界面、测试四层。</div></div>';
  const cols={};
  p.tickets.forEach(t=>{(cols[t.col]=cols[t.col]||[]).push(t);});
  const body=Object.keys(cols).sort((a,b)=>a-b).map(c=>
    '<div class="col"><div class="colhead">第 '+c+' 层</div>'+cols[c].map(t=>
      '<div class="tcard '+t.s+'"><div class="th"><span class="tid">'+t.id+'</span>'+
      '<span class="pill '+CHIP[t.s][1]+'">'+CHIP[t.s][0]+'</span></div>'+
      '<div class="ttl">'+t.t+(t.flag?' <span class="gf">◆</span>':'')+'</div>'+
      '<div class="segs">'+[0,1,2,3].map(i=>'<i class="'+(i<t.seg?'on':'')+'"></i>').join('')+'</div>'+
      '<div class="dep">'+t.d+'</div></div>').join('')+'</div>').join('');
  return '<div class="card"><h3>垂直切片 <span class="pill p-teal">每片穿透四层</span>'+
    '<span style="margin-left:auto;font-size:11px;color:var(--label-3);font-weight:400">数据库 → 服务 → 界面 → 测试</span></h3>'+
    '<div class="bd"><div class="legend">'+
      '<span><i style="background:var(--green)"></i>已完成</span>'+
      '<span><i style="background:var(--blue)"></i>进行中</span>'+
      '<span><i style="background:var(--orange)"></i>前沿 · 可开工</span>'+
      '<span><i style="background:#c7c7cc"></i>被阻塞</span></div>'+
    '<div class="board">'+body+'</div></div></div>';
}

      '<td>'+r.by+'</td><td>'+r.verdict.by+'</td><td>'+r.verdict.method+'</td>'+

    '<table class="audit"><thead><tr><th>阶段</th><th>skill</th><th>运行区间</th><th>触发者</th>'+
    '<th>验收人</th><th>验收方法</th><th>状态</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>'+
    '<div class="card"><h3>审计口径</h3><div class="bd" style="font-size:12.5px;color:var(--label-2);line-height:1.75">'+

    '</div></div>'+
    '<div class="field"><label>未通过时</label><select>'+
      ['退回该切片，按新设计重做','下调目标并记入 ADR','接受现状，记为已知限制','升级给人处理，暂停后续阶段']
      .map((o,i)=>'<option'+(i===0?' selected':'')+'>'+o+'</option>').join('')+'</select></div>'+
    '<div class="field"><label>阻塞</label><label class="sw"><input type="checkbox"'+(g.block?' checked':'')+'><i></i>阻塞后续阶段</label></div>'+
    '<div style="display:flex;gap:8px;margin-top:16px">'+
    '<button class="btn btn-p" style="flex:1" onclick="toast(\'门的配置已保存\')">保存</button>'+
    '<button class="btn" style="flex:1" onclick="toast(\'已退回，agent 按新设计重做\')">退回重做</button>'+
    '</div></div></div>';
  h+='<div class="card"><h3>这条门会怎么执行</h3><div class="bd" style="font-size:12.5px;color:var(--label-2);line-height:1.75">'+
    '先跑自动部分（CI / 类型 / 测试）。然后按你勾选的方法依次叠加：侧向验证会另起一个平行 agent，'+
    '只读 spec 与证据、不看实现，独立给结论；交叉验证要求至少两条互相独立的证据都指向同一结论；'+
    '对抗验证会派一个专门找反例的 agent。全部通过后，才把结论交给 <b style="color:var(--label)">'+g.owner+'</b> 等待签署。</div></div>';
  el.innerHTML=h;
}

function globalInspector(){
  const keys=Object.keys(PROJECTS);
  const blk=Object.values(PROJECTS).reduce((n,q)=>n+q.blk,0);
  let h='<div class="ihead"><h2>全局设置</h2>'+
    '<button class="btn btn-p" onclick="openModal()">插入门</button></div>';

  h+='<div class="card"><h3>组合状态</h3><div class="bd">';
  keys.forEach(k=>{const q=PROJECTS[k];
    h+='<div class="kv" style="cursor:pointer" onclick="runAction(\'scope:'+k+'\')">'+
      '<span class="dot '+q.dot+'"></span><span class="k">'+q.name+'</span>'+
      '<span class="v">'+q.stageNo+'/'+q.stageTotal+(q.blk?' · '+q.blk+' 阻塞':'')+'</span></div>';});
  h+='</div></div>';

  h+='<div class="card"><h3>门控默认值</h3><div class="bd">'+
    '<div class="field"><label>新项目的默认验收方法</label><div class="checks">'+
      ['自动检查','自检报告','侧向验证','交叉验证','对抗验证','人工签署']
      .map((m,i)=>'<label><input type="checkbox"'+(i<2||i===5?' checked':'')+'>'+m+'</label>').join('')+
    '</div><div class="hint">新项目初始化时套用；单个门仍可覆盖。</div></div>'+
    '<div class="field"><label>默认未通过动作</label><select>'+
      ['退回该切片，按新设计重做','下调目标并记入 ADR','接受现状，记为已知限制','升级给人处理，暂停后续阶段']
      .map((o,i)=>'<option'+(i===0?' selected':'')+'>'+o+'</option>').join('')+'</select></div>'+
    '<div class="field"><label>阻塞行为</label><label class="sw"><input type="checkbox" checked><i></i>'+
    '阻塞时不推进后续阶段</label></div>'+
    '<div style="margin-top:14px"><button class="btn btn-p" style="width:100%" onclick="toast(\'全局门控默认值已保存\')">保存默认值</button></div>'+
  '</div></div>';

  h+='<div class="card"><h3>角色分派</h3><div class="bd">'+
    '<div style="font-size:12px;color:var(--label-2);line-height:1.7;margin-bottom:13px">'+
    '门挂的是<b style="color:var(--label)">角色</b>，不是人。现在 '+keys.length+
    ' 个项目的全部角色都由你一个人承担；将来把成员挂到角色上，门本身不用改。</div>';
  [['PO / 需求验收','你'],['技术负责人','你'],['QA / 验收','你'],['运维 / 发布','你'],['安全','你']]
  .forEach(r=>{
    h+='<div class="field" style="margin-bottom:9px"><label>'+r[0]+'</label><select>'+
      '<option>'+r[1]+'</option><option>＋ 邀请成员…</option></select></div>';});
  h+='<div style="margin-top:14px"><button class="btn" style="width:100%" onclick="toast(\'已打开角色分派\')">管理成员</button></div>'+
  '</div></div>';

  h+='<div class="card"><h3>通知</h3><div class="bd">'+
    '<div class="field"><label>什么时候叫我</label><div class="checks">'+
      '<label><input type="checkbox" checked>阻塞点出现（当前 '+(blk||0)+' 个）</label>'+
      '<label><input type="checkbox" checked>阶段完成待验收</label>'+
      '<label><input type="checkbox">CI 失败</label>'+
      '<label><input type="checkbox">agent 崩溃或超时</label>'+
      '<label><input type="checkbox">发布被批准 / 回滚</label>'+
    '</div></div>'+
    '<div class="field"><label>渠道</label><div class="checks">'+
      '<label><input type="checkbox" checked>桌面通知</label>'+
      '<label><input type="checkbox" checked>邮件摘要（每 30 分钟）</label>'+
      '<label><input type="checkbox">即时消息</label>'+
    '</div></div>'+
  '</div></div>';
  return h;
}

function renderAll(){renderMenubar();renderToolbar();renderSidebar();renderSeg();renderMain();renderInspector();renderStatusbar();}

function bindMain(){
  document.querySelectorAll('.stage').forEach(s=>s.onclick=()=>{STATE.stage=+s.dataset.i;renderMain();});
  document.querySelectorAll('#main .gate[data-g]').forEach(g=>g.onclick=e=>{
    if(e.target.closest('.btn'))return;
    STATE.gate=g.dataset.g;renderMain();renderInspector();});
  document.querySelectorAll('#main .gate[data-s]').forEach(g=>g.onclick=e=>{
    if(e.target.closest('.btn'))return;
    STATE.scope='project';STATE.project=g.dataset.s;STATE.view='inbox';STATE.gate=null;
    renderAll();toast('已进入 '+PROJECTS[g.dataset.s].name+' 的收件箱');});
  document.querySelectorAll('#main tr[data-s]').forEach(r=>r.onclick=()=>runAction('scope:'+r.dataset.s));
  document.querySelectorAll('#main .tlrow[data-s]').forEach(r=>r.onclick=()=>runAction('scope:'+r.dataset.s));
  document.querySelectorAll('#main .gate .gbtns .btn').forEach(b=>b.onclick=()=>{
    const card=b.closest('.gate');
    card.classList.add('done-gate');
    card.querySelectorAll('.btn').forEach(x=>x.disabled=true);
    if(card.dataset.g){
      const s=card.dataset.g.split('/');
      const q=PROJECTS[s[0]],gate=q.gates.find(x=>x.id===s[1]);
      if(gate&&gate.block)q.blk=Math.max(0,q.blk-1);
    }
    renderSidebar();renderSeg();renderStatusbar();
    toast(b.dataset.msg);
  });
}

function openModal(){
  const portfolio=STATE.scope==='portfolio';
  const p=P();
  const pw=document.getElementById('mProjWrap'),pj=document.getElementById('mProj');
  pw.style.display=portfolio?'':'none';
  if(portfolio){
    pj.innerHTML=Object.keys(PROJECTS).map(k=>
      '<option value="'+k+'"'+(k===STATE.project?' selected':'')+'>'+PROJECTS[k].name+'</option>').join('');
  }
  document.getElementById('mScope').innerHTML=
    p.pipeline.map((s,i)=>'<option value="阶段 '+(i+1)+' · '+s.n+'">阶段 '+(i+1)+' · '+s.n+'</option>').join('')+
    p.tickets.map(t=>'<option value="切片 '+t.id+'">切片 '+t.id+' · '+t.t+'</option>').join('')+
    '<option value="产物 · spec.md">产物 · spec.md</option>';
  document.getElementById('overlay').classList.add('on');
}
function closeModal(){document.getElementById('overlay').classList.remove('on');}

function createGate(){
  const target=(STATE.scope==='portfolio')?document.getElementById('mProj').value:STATE.project;
  const p=PROJECTS[target];
  const name=document.getElementById('mName').value.trim()||'人工验收门';
  const scope=document.getElementById('mScope').value;
  const owner=document.getElementById('mOwner').value;
  const fail=document.getElementById('mFail').value;
  const block=document.getElementById('mBlock').checked;
  const methods=[].slice.call(document.querySelectorAll('.checks input:checked')).map(i=>i.value);
  const note=document.getElementById('mNote').value.trim();
  const id='x'+Date.now();
  p.gates.unshift({id:id,lv:'warn',icon:'gate',title:name,scope:scope,trigger:'Modal 插入（你）',
    owner:owner,methods:methods.length?methods:['人工签署'],block:block,
    body:(note||'你手动挂上的验收门。')+' 未通过时：'+fail+'。',
    btns:[['通过','门已通过，agent 继续'],[fail,'已按要求处理']]});
  if(block)p.blk++;
  STATE.scope='project';STATE.project=target;
  STATE.gate=target+'/'+id;STATE.view='inbox';
  closeModal();
  document.getElementById('mName').value='';document.getElementById('mNote').value='';
  renderAll();
  toast('验收门已挂到 '+p.name+' 的「'+scope+'」，验收人：'+owner);
}

document.getElementById('overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeMenu();closeModal();STATE.sw=false;renderSwitcher();}});
document.addEventListener('click',()=>{
  if(openIdx!==null)closeMenu();
  if(STATE.sw){STATE.sw=false;renderSwitcher();}
});
document.addEventListener('keydown',e=>{
  if(!(e.metaKey||e.ctrlKey))return;
  const map={'0':'pview:overview','6':'pview:timeline','7':'pview:activity',
    '1':'view:pipeline','2':'view:board','3':'view:inbox','4':'view:releases','5':'view:records',
    'g':'insertGate'};
  const a=map[e.key];
  if(a){e.preventDefault();runAction(a);}
});
document.getElementById('sbToggle').onclick=()=>{
  document.getElementById('sidebar').classList.toggle('collapsed');renderStatusbar();};
document.getElementById('inspToggle').onclick=()=>{
  document.getElementById('inspector').classList.toggle('collapsed');};
setInterval(()=>{
  const el=document.getElementById('mbClock');
  if(!el)return;
  const d=new Date();
  const wd=['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];
  const hm=(d.getHours()<10?'0':'')+d.getHours()+':'+(d.getMinutes()<10?'0':'')+d.getMinutes();
  el.textContent=wd+' '+hm;
},20000);

renderAll();
</script>
</body>
